

services:
  mongo:
    image: mongo:7
    container_name: hookline_mongo
    restart: always
    volumes:
      - mongo_data:/data/db
    expose:
      - "27017"

  redis:
    image: redis:7-alpine
    container_name: hookline_redis
    restart: always
    expose:
      - "6379"

  api:
    build: .
    container_name: hookline_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/hookline
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env.production
    depends_on:
      - mongo
      - redis
    command: node server.js

  worker:
    build: .
    container_name: hookline_worker
    restart: always
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/hookline
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env.production
    depends_on:
      - mongo
      - redis
    command: node worker.js

volumes:
  mongo_data: